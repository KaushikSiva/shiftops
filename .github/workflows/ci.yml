name: Verify application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglfw3
      - run: pip install -r requirements.lock
      - run: python -m pytest -q
      - run: npm ci && npm run build
        working-directory: web
      - run: bash -n scripts/deploy.sh
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Browser workflow, controls and mobile layout
        run: |
          mkdir -p artifacts
          uvicorn backend.app:app --host 127.0.0.1 --port 8197 > artifacts/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8197/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8197/api/health
          npm run test:e2e --prefix web
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation
          path: |
            artifacts/browser-report.json
            artifacts/browser-evidence.json
            artifacts/*.png
            artifacts/server.log
